# Builds the Chrome extension and attaches it as a zip to a GitHub Release.
# Triggered by pushing a tag like v0.1.0, or by hand (creates a draft release).
name: Release Chrome extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @ankiski/extension build
      - id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - run: |
          cd apps/extension/dist
          zip -r "../../../ankiski-extension-${{ steps.meta.outputs.version }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: ankiski-extension-${{ steps.meta.outputs.version }}
          path: ankiski-extension-*.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          draft: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: ankiski-extension-*.zip
