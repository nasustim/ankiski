# Manual-only deployment of apps/web to GitHub Pages (https://nasustim.github.io/ankiski/).
# Deployment is NOT enabled yet: this workflow only runs when triggered by hand
# and GitHub Pages must be enabled (source: GitHub Actions) by the owner first.
name: Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      # vite.config.ts sets base "/ankiski/"
      - run: bun run --filter @ankiski/web build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
